name: "Release"

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Cache Electron downloads (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Electron downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Electron downloads (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Cache APT Packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-apt-flatpak-v1

      - name: Install Flatpak dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Cria o diretório de cache se não existir
          mkdir -p ~/apt-cache

          # 2. Copia debs antigos de volta para o cache do sistema (se houver)
          if [ "$(ls -A ~/apt-cache)" ]; then
            sudo cp -r ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi

          # 3. Atualiza e instala sem baixar o que já existe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils

          # 4. Copia os novos debs baixados de volta para o cache do usuário
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

          # 5. Configura o Flathub
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          # Só instala runtimes se não foi restaurado pelo cache do flatpak
          if [ "${{ steps.flatpak-cache.outputs.cache-hit }}" != 'true' ]; then
            flatpak install --user -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 org.electronjs.Electron2.BaseApp//23.08
          fi

      - name: Run quality checks
        run: npm run check

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            npm run build -- --publish never --mac --x64 --arm64
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            npm run build -- --publish never --win --x64
          else
            npm run build -- --publish never --linux --x64
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test macOS arm64 bundle
        if: matrix.os == 'macos-latest'
        run: |
          npm run smoke:macos -- "dist/mac-arm64/OpenCreate Forge.app" arm64
          npm run smoke:macos -- "dist/mac/OpenCreate Forge.app" x86_64

      - name: Upload macOS smoke diagnostics
        if: failure() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-diagnostics
          path: |
            dist/macos-smoke.log
            ~/Library/Logs/OpenCreate Forge/startup.log
            ~/Library/Logs/DiagnosticReports/OpenCreate Forge*.ips
          if-no-files-found: ignore

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.flatpak
          if-no-files-found: error

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Remove duplicate draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.tag_name }}
        run: |
          DUPLICATE_RELEASE_IDS=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == true and .tag_name == env.TAG_NAME) | .id')

          while IFS= read -r RELEASE_ID; do
            if [ -n "$RELEASE_ID" ]; then
              echo "Deleting duplicate draft release $RELEASE_ID for tag $TAG_NAME"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID"
            fi
          done <<< "$DUPLICATE_RELEASE_IDS"

      - name: Validate release artifacts
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          expected_assets=(
            "OpenCreate Forge Setup ${VERSION}.exe"
            "OpenCreate Forge ${VERSION}.exe"
            "OpenCreate Forge-${VERSION}.dmg"
            "OpenCreate Forge-${VERSION}-mac.zip"
            "OpenCreate Forge-${VERSION}-arm64.dmg"
            "OpenCreate Forge-${VERSION}-arm64-mac.zip"
            "OpenCreate Forge-${VERSION}.AppImage"
            "OpenCreate Forge-${VERSION}-x86_64.flatpak"
            "opencreate-forge_${VERSION}_amd64.deb"
            "opencreate-forge-${VERSION}.x86_64.rpm"
          )

          for asset in "${expected_assets[@]}"; do
            if [ ! -f "artifacts/$asset" ]; then
              echo "::error::Expected release asset is missing: $asset"
              echo "Available artifacts:"
              find artifacts -maxdepth 1 -type f -print | sort
              exit 1
            fi
          done

      - name: Prepare Release Body
        id: release_body
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="${{ steps.get_version.outputs.tag_name }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/$REPO/releases/download/$TAG"

          # GitHub stores the uploaded asset name with dots, while its UI label
          # may display spaces. Release download URLs must use the stored name.
          WINDOWS_INSTALLER="OpenCreate.Forge.Setup.${VERSION}.exe"
          WINDOWS_PORTABLE="OpenCreate.Forge.${VERSION}.exe"
          MAC_X64_DMG="OpenCreate.Forge-${VERSION}.dmg"
          MAC_X64_ZIP="OpenCreate.Forge-${VERSION}-mac.zip"
          MAC_ARM64_DMG="OpenCreate.Forge-${VERSION}-arm64.dmg"
          MAC_ARM64_ZIP="OpenCreate.Forge-${VERSION}-arm64-mac.zip"
          LINUX_APPIMAGE="OpenCreate.Forge-${VERSION}.AppImage"
          LINUX_FLATPAK="OpenCreate.Forge-${VERSION}-x86_64.flatpak"
          INTERNAL_NAME="opencreate-forge"

          cat <<EOF > body.md
          ## Downloads

          > macOS builds use an ad-hoc signature and are not notarized. On first launch, use Finder and approve the app in **System Settings → Privacy & Security → Open Anyway** if macOS asks for confirmation.

          <table>
          <thead>
          <tr>
          <th>Platform</th>
          <th>Architecture</th>
          <th>Format</th>
          </tr>
          </thead>
          <tbody>
          <tr>
          <td rowspan="2"><strong>Windows</strong></td>
          <td rowspan="2">x64</td>
          <td><a href="$BASE_URL/$WINDOWS_INSTALLER">Installer (EXE)</a></td>
          </tr>
          <tr>
          <td><a href="$BASE_URL/$WINDOWS_PORTABLE">Portable (EXE)</a></td>
          </tr>
          <tr>
          <td rowspan="4"><strong>macOS</strong></td>
          <td rowspan="2">Intel (x64)</td>
          <td><a href="$BASE_URL/$MAC_X64_DMG">DMG</a></td>
          </tr>
          <tr>
          <td><a href="$BASE_URL/$MAC_X64_ZIP">Portable (ZIP/APP)</a></td>
          </tr>
          <tr>
          <td rowspan="2">Apple Silicon (arm64)</td>
          <td><a href="$BASE_URL/$MAC_ARM64_DMG">Download (DMG)</a></td>
          </tr>
          <tr>
          <td><a href="$BASE_URL/$MAC_ARM64_ZIP">Portable (ZIP/APP)</a></td>
          </tr>
          <tr>
          <td rowspan="4"><strong>Linux</strong></td>
          <td rowspan="4">x64</td>
          <td><a href="$BASE_URL/$LINUX_APPIMAGE">AppImage</a></td>
          </tr>
          <tr>
          <td><a href="$BASE_URL/$LINUX_FLATPAK">Flatpak</a></td>
          </tr>
          <tr>
          <td><a href="$BASE_URL/${INTERNAL_NAME}_${VERSION}_amd64.deb">Debian (DEB)</a></td>
          </tr>
          <tr>
          <td><a href="$BASE_URL/$INTERNAL_NAME-$VERSION.x86_64.rpm">Fedora (RPM)</a></td>
          </tr>
          </tbody>
          </table>

          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: body.md
          files: artifacts/*
          overwrite_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
